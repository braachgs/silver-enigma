# Builds the Day Board Android widget (dayboard-android/) and publishes the
# APK at a fixed link:
#   https://github.com/braachgs/silver-enigma/releases/download/widget/DayBoard-widget.apk
#
# Signing: every build must use the same key, or Android won't install it as
# an update. The key's password exists only in the DAYBOARD_KEYSTORE_PASSWORD
# repository secret, which the owner sets. On the first run with that secret,
# this workflow creates the key (dayboard-android/app/release.p12, encrypted
# with the password) and commits it; later runs reuse it. Without the secret,
# the build is only checked, not published.
name: Day Board widget (Android)

on:
  push:
    paths:
      - 'dayboard-android/**'
      - '.github/workflows/dayboard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dayboard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only whether the secret exists; the secret itself goes to the steps that need it.
      HAS_KEY: ${{ secrets.DAYBOARD_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK; make sure the pieces we compile against are there.
      - name: Install Android 15 SDK platform
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Create the signing key (first signed build only)
        if: env.HAS_KEY == 'true' && hashFiles('dayboard-android/app/release.p12') == ''
        env:
          DAYBOARD_KEYSTORE_PASSWORD: ${{ secrets.DAYBOARD_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore dayboard-android/app/release.p12 \
            -alias dayboard -keyalg RSA -keysize 3072 -validity 36500 -dname "CN=Day Board widget" \
            -storepass:env DAYBOARD_KEYSTORE_PASSWORD -keypass:env DAYBOARD_KEYSTORE_PASSWORD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dayboard-android/app/release.p12
          git commit -m "Day Board widget: signing key, encrypted with the DAYBOARD_KEYSTORE_PASSWORD secret"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test the board logic and layout
        run: gradle -p dayboard-android/core test --console=plain

      - name: Build the APK
        env:
          DAYBOARD_KEYSTORE_PASSWORD: ${{ secrets.DAYBOARD_KEYSTORE_PASSWORD }}
        run: gradle -p dayboard-android :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain

      - name: Keep the APK and previews with this run
        uses: actions/upload-artifact@v4
        with:
          name: day-board-widget-${{ github.run_number }}
          path: |
            dayboard-android/app/build/outputs/apk/release/*.apk
            dayboard-android/core/build/previews/*.png

      - name: Publish the APK
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dayboard-android/app/build/outputs/apk/release/app-release.apk DayBoard-widget.apk
          gh release delete widget --cleanup-tag --yes || true
          gh release create widget DayBoard-widget.apk \
            --target "$GITHUB_SHA" \
            --title "Day Board widget 1.${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap DayBoard-widget.apk to install or update. Built from ${GITHUB_SHA::7}." \
            --latest

      - name: Say why nothing was published
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Built and tested, not published. Add the DAYBOARD_KEYSTORE_PASSWORD secret to publish signed APKs."
